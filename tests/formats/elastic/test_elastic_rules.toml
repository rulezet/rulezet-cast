[rule]
author = ["Elastic"]
description = """
Detects network connections to known Tor exit nodes. Tor usage may indicate attempts
to anonymize traffic for data exfiltration or command-and-control communication.
"""
language = "eql"
license = "Elastic License v2"
name = "Valid_TorNetworkConnection - Connection to Tor Exit Node"
references = ["https://attack.mitre.org/techniques/T1090/003/"]
risk_score = 55
rule_id = "c7d3a2f1-8e4b-4c9d-a0e5-1f2b3c4d5e6f"
severity = "medium"
tags = [
    "Domain: Endpoint",
    "Use Case: Threat Detection",
    "Tactic: Command and Control",
    "Data Source: Elastic Defend",
]
type = "eql"
index = ["logs-endpoint.events.network-*"]
query = '''
network where event.type == "start" and
  destination.port in (9001, 9030) and
  network.direction == "outgoing"
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

  [rule.threat.tactic]
