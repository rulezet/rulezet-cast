[rule]
author = ["Elastic"]
description = """
Detects the creation of new local user accounts. Adversaries may create accounts
to maintain persistent access or escalate privileges on a compromised system.
"""
language = "eql"
license = "Elastic License v2"
name = "Valid_LocalUserAccountCreation - New Local User Account Created"
references = ["https://attack.mitre.org/techniques/T1136/001/"]
risk_score = 21
rule_id = "f4e5d6c7-b8a9-4d2e-8f1c-3a4b5c6d7e8f"
severity = "low"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "OS: Linux",
    "Use Case: Threat Detection",
    "Tactic: Persistence",
    "Data Source: Elastic Defend",
]
type = "eql"
index = ["logs-endpoint.events.iam-*", "winlogbeat-*"]
query = '''
iam where event.action in ("user-created", "added-user-account") and
  not user.name : ("SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE")
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

  [rule.threat.tactic]
  name = "Persistence"
  id = "TA0003"
  reference = "https://attack.mitre.org/tactics/TA0003/"

  [[rule.threat.technique]]
  name = "Create Account"
  id = "T1136"
  reference = "https://attack.mitre.org/techniques/T1136/"

    [[rule.threat.technique.subtechnique]]
    name = "Local Account"
    id = "T1136.001"
    reference = "https://attack.mitre.org/techniques/T1136/001/"

