[metadata]
creation_date = "2026/01/30"
integration = ["endpoint"]
maturity = "production"
updated_date = "2026/02/09"

[rule]
author = ["Elastic"]
description = """
Detects executable file downloads via wget to suspicious locations such as /tmp or /Users/Shared.
Threat actors commonly use wget to download malicious payloads and additional tools for post-exploitation.
"""
language = "eql"
license = "Elastic License v2"
name = "Valid_WgetDownload - Executable File Download via Wget"
references = ["https://attack.mitre.org/techniques/T1105/"]
risk_score = 47
rule_id = "36755b43-a1f9-4f2c-9b61-6b240dd0e164"
severity = "medium"
tags = [
    "Domain: Endpoint",
    "OS: macOS",
    "Use Case: Threat Detection",
    "Tactic: Command and Control",
    "Data Source: Elastic Defend",
]
type = "eql"
index = ["logs-endpoint.events.network-*", "logs-endpoint.events.file-*"]
query = '''
sequence by process.entity_id with maxspan=30s
  [network where host.os.type == "macos" and event.type == "start" and process.name == "wget"]
  [file where host.os.type == "macos" and event.action == "modification" and
    process.name == "wget" and
    file.path like ("/tmp/*", "/private/tmp/*", "/Users/Shared/*")]
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

  [rule.threat.tactic]
  name = "Command and Control"
  id = "TA0011"
  reference = "https://attack.mitre.org/tactics/TA0011/"

  [[rule.threat.technique]]
  name = "Ingress Tool Transfer"
  id = "T1105"
  reference = "https://attack.mitre.org/techniques/T1105/"

[metadata]
creation_date = "2025/11/15"
integration = ["windows"]
maturity = "production"
updated_date = "2026/01/10"

[rule]
author = ["Elastic"]
description = """
Identifies the execution of PowerShell with a base64-encoded command argument.
Attackers often encode PowerShell commands to obfuscate malicious payloads and
bypass security controls.
"""
language = "kql"
license = "Elastic License v2"
name = "Valid_PowershellBase64 - Encoded PowerShell Command Execution"
references = [
    "https://attack.mitre.org/techniques/T1059/001/",
    "https://docs.microsoft.com/en-us/powershell/",
]
risk_score = 73
rule_id = "a8b2e9c4-3f1d-4e7a-b5c6-2d8f0e1a9b3c"
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Execution",
    "Data Source: Elastic Defend",
]
type = "eql"
index = ["logs-endpoint.events.process-*", "winlogbeat-*"]
query = '''
process where host.os.type == "windows" and event.type == "start" and
  process.name : ("powershell.exe", "pwsh.exe") and
  process.args : ("-EncodedCommand", "-enc", "-en") and
  process.args_count >= 2
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

  [rule.threat.tactic]
  name = "Execution"
  id = "TA0002"
  reference = "https://attack.mitre.org/tactics/TA0002/"

  [[rule.threat.technique]]
  name = "Command and Scripting Interpreter"
  id = "T1059"
  reference = "https://attack.mitre.org/techniques/T1059/"

    [[rule.threat.technique.subtechnique]]
    name = "PowerShell"
    id = "T1059.001"
    reference = "https://attack.mitre.org/techniques/T1059/001/"

