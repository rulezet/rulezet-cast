# ============================================================
# RULECAST — CRS / ModSecurity TEST SUITE
#
# Rules derived from OWASP CRS 4.x official patterns
# https://github.com/coreruleset/coreruleset
#
# EXPECTED RESULTS (verify and update after first run):
#   Total rules  : 41
#   Valid        : 32
#   Invalid      : 9
#
# Valid  = 27 Valid_ + 5 Nasty_ (all structurally accepted by msc_pyparser)
# Invalid = 9 rules with structural or @rx regex errors
# Nasty_ = no pass/fail assertion — edge-case behaviour observed
# Note: NOT_A_DIRECTIVE and GARBAGE lines are silently dropped by split_rules
#       (only Sec* directives are extracted), so they do not appear in totals
#
# Run with: python3 main.py test → choose crs → file → 4
# ============================================================


# ============================================================
# VALID — BASIC STRUCTURE
# ============================================================

# Minimal single-line rule — all three SecRule parts present
SecRule ARGS "@rx <script" "id:941100,phase:2,deny,msg:'Valid_Basic XSS Single Line',tag:'OWASP_CRS',tag:'attack-xss',severity:'CRITICAL',ver:'OWASP_CRS/4.0.0'"

# Standard multi-line format — backslash continuation must be joined by split_rules()
SecRule REQUEST_URI "@rx /etc/passwd" \
    "id:930100,\
    phase:2,\
    deny,\
    msg:'Valid_LFI Path Traversal Multiline Backslash',\
    tag:'OWASP_CRS',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# Block action (CRS 4.x uses block, not deny, by default)
SecRule REQUEST_BODY "@rx union\s+(?:all\s+)?select" \
    "id:942100,\
    phase:2,\
    block,\
    capture,\
    msg:'Valid_SQL Injection Union Select Block Action',\
    tag:'OWASP_CRS',\
    tag:'attack-sqli',\
    tag:'OWASP_TOP_10/A1',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# Pass action — used in exclusion / allow-list rules
SecRule REQUEST_URI "@rx ^/api/health$" \
    "id:900900,\
    phase:1,\
    pass,\
    nolog,\
    msg:'Valid_Pass Action Allowlist Health Endpoint',\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0'"


# ============================================================
# VALID — SQL INJECTION (CRS REQUEST-942)
# ============================================================

# SQL tautology: 1=1, 1 OR 1, etc.
SecRule ARGS "@rx \b(?:1\s*=\s*1|or\s+1\s*=\s*1|'\s*or\s*'\s*1'\s*=\s*'1)\b" \
    "id:942110,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Valid_SQL Injection Tautology Attack',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'OWASP_CRS',\
    tag:'attack-sqli',\
    tag:'OWASP_TOP_10/A1',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    ver:'OWASP_CRS/4.0.0'"

# SQL blind injection boolean keywords
SecRule ARGS "@rx \b(?:and|or)\b\s*\d+\s*(?:=\s*\d+|between\b)" \
    "id:942120,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Valid_SQL Blind Injection Boolean Keywords',\
    tag:'OWASP_CRS',\
    tag:'attack-sqli',\
    tag:'paranoia-level/2',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# Stacked SQL statements
SecRule ARGS "@rx ;\s*(?:drop|create|alter|insert|update|delete|truncate|replace)\b" \
    "id:942130,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Valid_SQL Injection Stacked Statement Attack',\
    tag:'OWASP_CRS',\
    tag:'attack-sqli',\
    tag:'PCI/6.5.2',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"


# ============================================================
# VALID — XSS (CRS REQUEST-941)
# ============================================================

# JavaScript event handler injection
SecRule ARGS "@rx \bon(?:abort|blur|click|dblclick|error|focus|keydown|keypress|keyup|load|mousedown|mousemove|mouseout|mouseover|mouseup|reset|resize|select|submit|unload)\s*=" \
    "id:941120,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'Valid_XSS JavaScript Event Handler Injection',\
    tag:'OWASP_CRS',\
    tag:'attack-xss',\
    tag:'OWASP_TOP_10/A7',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# HTML entity encoding evasion
SecRule ARGS "@rx (?:&#(?:x0*(?:3c|3e|22|27|60)|0*(?:60|62|34|39|96))|\\\\x(?:3c|3e|22|27))" \
    "id:941130,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    msg:'Valid_XSS HTML Entity Encoding Evasion Attempt',\
    tag:'OWASP_CRS',\
    tag:'attack-xss',\
    tag:'paranoia-level/2',\
    severity:'HIGH',\
    ver:'OWASP_CRS/4.0.0'"

# JavaScript URI scheme
SecRule ARGS "@rx (?:javascript|vbscript|data)\s*:" \
    "id:941140,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:cssHexDecode,t:lowercase,\
    msg:'Valid_XSS JavaScript URI Scheme Injection',\
    tag:'OWASP_CRS',\
    tag:'attack-xss',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"


# ============================================================
# VALID — LFI / RFI (CRS REQUEST-930/931)
# ============================================================

# Directory traversal with multiple dots
SecRule ARGS "@rx (?:\.{2,}[/\\\\]){2,}" \
    "id:930110,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:normalizePath,\
    msg:'Valid_LFI Directory Traversal Dotdot Repeated',\
    tag:'OWASP_CRS',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'capec/1000/255/153',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# PHP stream wrapper for RFI
SecRule ARGS "@rx (?:php|zlib|bzip2|expect|data)://" \
    "id:931100,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Valid_RFI PHP Wrapper Stream Inclusion',\
    tag:'OWASP_CRS',\
    tag:'attack-rfi',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"


# ============================================================
# VALID — REMOTE CODE EXECUTION (CRS REQUEST-932)
# ============================================================

# Unix shell command separators
SecRule ARGS "@rx [;&|`]\s*(?:\$\(|\bcat\b|\bwget\b|\bcurl\b|\bchmod\b|\bchown\b|\bnc\b|\bnetcat\b|\bping\b|\bsh\b|\bbash\b|\bpython\b|\/bin\/)" \
    "id:932100,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    msg:'Valid_RCE Unix Shell Command Injection via Separator',\
    tag:'OWASP_CRS',\
    tag:'attack-rce',\
    tag:'paranoia-level/1',\
    tag:'OWASP_TOP_10/A1',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# PHP code injection — eval / assert / preg_replace with /e
SecRule ARGS "@rx \b(?:eval|assert|system|exec|passthru|shell_exec|popen|proc_open)\s*\(" \
    "id:932110,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Valid_RCE PHP Code Injection Function Call',\
    tag:'OWASP_CRS',\
    tag:'attack-injection-php',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# Log4Shell — JNDI lookup exploitation
SecRule ARGS|REQUEST_URI|REQUEST_HEADERS "@rx \$\{(?:j|J)(?:n|N)(?:d|D)(?:i|I)\s*:" \
    "id:932160,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,\
    msg:'Valid_Log4Shell RCE Exploit Attempt CVE-2021-44228',\
    tag:'OWASP_CRS',\
    tag:'attack-rce',\
    tag:'paranoia-level/1',\
    tag:'CVE-2021-44228',\
    severity:'CRITICAL',\
    rev:'3',\
    ver:'OWASP_CRS/4.0.0'"


# ============================================================
# VALID — METADATA & FIELD VARIETY
# ============================================================

# Six tags — all must land in the tags list
SecRule REQUEST_HEADERS:User-Agent "@rx (?:sqlmap|nikto|nessus|openvas|masscan|nmap|acunetix|burpsuite|havij|pangolin)" \
    "id:913100,\
    phase:1,\
    block,\
    msg:'Valid_Scanner User-Agent Six Tags',\
    tag:'OWASP_CRS',\
    tag:'attack-reputation-scanner',\
    tag:'paranoia-level/1',\
    tag:'PCI/6.5.2',\
    tag:'OWASP_TOP_10/A6',\
    tag:'capec/1000/118/169',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# rev: field present — must appear in metadata
SecRule RESPONSE_HEADERS:Content-Type "@rx ^(?!text/)(?!application/json)(?!application/xml)" \
    "id:920470,\
    phase:3,\
    block,\
    msg:'Valid_Restricted Content Type Response Rev And Ver Fields',\
    tag:'OWASP_CRS',\
    tag:'attack-protocol',\
    severity:'HIGH',\
    rev:'5',\
    ver:'OWASP_CRS/4.0.0'"

# setvar + capture — both in AST actions, setvar must be collected
SecRule TX:ANOMALY_SCORE "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:949110,\
    phase:2,\
    deny,\
    msg:'Valid_Inbound Anomaly Score Threshold Exceeded Setvar',\
    tag:'OWASP_CRS',\
    tag:'anomaly-evaluation',\
    severity:'CRITICAL',\
    setvar:'tx.blocked=1',\
    ver:'OWASP_CRS/4.0.0'"

# Multiple transformations — t list must be fully collected
SecRule ARGS "@rx <img\s[^>]*\bsrc\s*=" \
    "id:941150,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:cssDecode,t:lowercase,\
    msg:'Valid_XSS Image Tag With Many Transformations',\
    tag:'OWASP_CRS',\
    tag:'attack-xss',\
    tag:'paranoia-level/2',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"


# ============================================================
# VALID — CVE EXTRACTION EDGE CASES
# ============================================================

# CVE only in msg string — no tag contains it
SecRule ARGS "@rx \.git/config" \
    "id:930200,\
    phase:2,\
    block,\
    msg:'Valid_CVE Only In Msg Git Config Exposure CVE-2019-19781',\
    tag:'OWASP_CRS',\
    tag:'attack-disclosure',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# CVE only inside a tag value — not in msg
SecRule REQUEST_URI "@rx /_wpeprivate/config\.json" \
    "id:941360,\
    phase:2,\
    block,\
    msg:'Valid_CVE In Tag Value WordPress Plugin',\
    tag:'OWASP_CRS',\
    tag:'CVE-2022-29455',\
    tag:'attack-disclosure',\
    severity:'HIGH',\
    ver:'OWASP_CRS/4.0.0'"

# Two CVEs — one in msg, one in a tag — must both appear, deduplicated
SecRule ARGS "@rx proc/self/environ" \
    "id:930120,\
    phase:2,\
    block,\
    msg:'Valid_Two CVEs Msg And Tag CVE-2019-11043',\
    tag:'OWASP_CRS',\
    tag:'CVE-2019-11045',\
    tag:'attack-rfi',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# SecAction — no variables or operator, just actions; still valid
SecAction \
    "id:900001,\
    phase:1,\
    pass,\
    nolog,\
    msg:'Valid_SecAction Initialization Transaction Variables',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:'tx.critical_anomaly_score=5',\
    setvar:'tx.error_anomaly_score=4',\
    setvar:'tx.warning_anomaly_score=3',\
    setvar:'tx.notice_anomaly_score=2'"


# ============================================================
# NASTY RULES — EDGE CASES (no pass/fail assertion)
# ============================================================

# No msg field — identity.name must fall back to "CRS Rule 942200", not crash
SecRule ARGS "@rx exec\s*\(" "id:942200,phase:2,deny,tag:'OWASP_CRS',tag:'attack-sqli',severity:'CRITICAL',ver:'OWASP_CRS/4.0.0'"

# No id field — original_uuid must be None, parser must not crash
SecRule ARGS "@rx system\s*\(" "phase:2,deny,msg:'Nasty_No ID Field UUID Must Be None',tag:'OWASP_CRS',severity:'HIGH',ver:'OWASP_CRS/4.0.0'"

# No severity field — metadata[severity] absent; normalize() must not crash
SecRule ARGS "@rx file_get_contents\s*\(" "id:944210,phase:2,deny,msg:'Nasty_No Severity Should Not Crash Normalize',tag:'OWASP_CRS',ver:'OWASP_CRS/4.0.0'"

# SecMarker — valid CRS construct (no id/msg); parse() must return safely
SecMarker "BEGIN_XSS_CHECKS"

# SecDefaultAction — sets defaults for subsequent rules; valid but unusual to parse standalone
SecDefaultAction "phase:2,deny,log,tag:'OWASP_CRS',ver:'OWASP_CRS/4.0.0'"


# ============================================================
# VALID — COMPLEX @rx PATTERNS (false-positive guards)
#
# These rules stress-test the @rx validator: they contain patterns
# that look syntactically tricky but are in fact valid regexes.
# The validator must NOT reject them.
# ============================================================

# Non-capturing group with alternation — balanced, must compile
SecRule ARGS "@rx (?:select|insert|update|delete)\s+\w+" \
    "id:942140,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Valid_SQL Keywords NonCapturing Group Alternation',\
    tag:'OWASP_CRS',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# Balanced capturing groups with optional middle group — all parens close
SecRule ARGS "@rx (union)\s+(all\s+)?(select)" \
    "id:942150,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Valid_SQL Union Select Balanced Capturing Groups',\
    tag:'OWASP_CRS',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"

# Character class with ranges — opening [ is closed, must not be confused with unclosed bracket
SecRule ARGS "@rx [a-zA-Z0-9_.@-]{32,}" \
    "id:942160,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    msg:'Valid_Long Token Character Class Range Not Unclosed Bracket',\
    tag:'OWASP_CRS',\
    tag:'attack-sqli',\
    severity:'HIGH',\
    ver:'OWASP_CRS/4.0.0'"

# Escaped parentheses — literal ( and ) in regex, not grouping — must not be flagged
SecRule ARGS "@rx \(select\s+\*\s+from\s+\w+\)" \
    "id:942170,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Valid_SQL Escaped Literal Parentheses Not Unbalanced Group',\
    tag:'OWASP_CRS',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    ver:'OWASP_CRS/4.0.0'"


# ============================================================
# INVALID RULES — msc_pyparser must reject all of these
# ============================================================

# Invalid: directive name is not a valid Sec* keyword
NOT_A_DIRECTIVE ARGS "@rx test" "id:990001,phase:2,deny,msg:'Invalid_Wrong Directive Name Not SecRule'"

# Invalid: action string opened with " but never closed
SecRule ARGS "@rx union" "id:990002,phase:2,deny,msg:'Invalid_Unclosed Double Quote Action String

# Invalid: garbled content — msg present via regex for naming
GARBAGE_NOT_CRS_AT_ALL msg:'Invalid_Completely Garbled Non CRS Content Here'

# Invalid: SecRule with action string in the variable position — no operator or proper structure
SecRule "id:990004,phase:2,deny,msg:'Invalid_Action String Where Variables Should Be'"

# Invalid: SecRule with variables only — operator and action string missing
SecRule ARGS

# Invalid: operator argument unclosed parenthesis in regex pattern
SecRule ARGS "@rx (select.*from" "id:990006,phase:2,deny,msg:'Invalid_Unclosed Regex Parenthesis In Operator',ver:'OWASP_CRS/4.0.0'"

# Invalid: actions use semicolons instead of commas — wrong separator
SecRule ARGS "@rx passwd" "id:990007;phase:2;deny;msg:'Invalid_Semicolons Instead Of Commas Action Separator'"

# Invalid: truncated — only the SecRule keyword, nothing else
SecRule

# Invalid: unclosed character class bracket in @rx pattern
SecRule ARGS "@rx [select.*from" "id:990008,phase:2,deny,msg:'Invalid_Unclosed Character Class Bracket In Regex',ver:'OWASP_CRS/4.0.0'"

# Invalid: bare star quantifier — nothing before * to repeat
SecRule ARGS "@rx *select" "id:990009,phase:2,deny,msg:'Invalid_Bare Star Quantifier No Preceding Token',ver:'OWASP_CRS/4.0.0'"

# Invalid: reversed quantifier bounds — min greater than max
SecRule ARGS "@rx foo{5,2}" "id:990010,phase:2,deny,msg:'Invalid_Reversed Quantifier Bounds Min Greater Than Max',ver:'OWASP_CRS/4.0.0'"
